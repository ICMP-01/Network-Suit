<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="url(#ring)" stroke-width="2"/>

  <!-- Outer radar ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Inner radar ring -->
  <circle cx="32" cy="32" r="15" stroke="url(#inner)" stroke-width="1" opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#22d3ee"/>

  <!-- Radar sweep line -->
  <line x1="32" y1="32" x2="52" y2="16" stroke="url(#ring)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Cross hairs -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#06b6d4" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.35"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#06b6d4" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.35"/>

  <!-- Network nodes: top-right -->
  <circle cx="47" cy="17" r="3" fill="#a855f7" opacity="0.9"/>
  <!-- bottom-left -->
  <circle cx="17" cy="47" r="2.5" fill="#06b6d4" opacity="0.8"/>
  <!-- top-left -->
  <circle cx="16" cy="18" r="2" fill="#22d3ee" opacity="0.6"/>

  <!-- Connection lines between nodes -->
  <line x1="32" y1="32" x2="47" y2="17" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="32" x2="17" y2="47" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="32" x2="16" y2="18" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
</svg>
